[package]
name = "rinch-code-editor-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-agnostic collaborative editing for the rinch code editor (yrs / y-sync)"

[dependencies]
# The engine. The version pin, the `sync` feature, and the offset-encoding
# invariant are documented in the workspace manifest; `lib.rs`'s pin test is
# what enforces the last of them.
yrs.workspace = true

# The text mirror this crate keeps beside the CRDT, purely so char offsets can
# be converted to and from yrs's UTF-16 indexing exactly and in O(log n). It
# also supersedes the old `projected_len`: comparing the mirror against the
# document is the divergence detector.
ropey.workspace = true

rinch-code-editor-buffer.workspace = true

[dev-dependencies]
# Not a dependency of this crate and never will be: nothing here knows what an
# editor is. It appears only in `model_sync.rs`, which drives two real
# `EditorModel`s through two documents to pin the integration contract end to
# end — the one place both halves have to be in the room together.
rinch-code-editor-model.workspace = true
