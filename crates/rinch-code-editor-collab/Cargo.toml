[package]
name = "rinch-code-editor-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-agnostic collaborative editing for the rinch code editor (automerge)"

[dependencies]
# The version pin, and more importantly the *feature* pin that keeps
# automerge's Text indexed in Unicode scalar values, are documented in the
# workspace manifest. The `automerge_text_indexing_is_unicode_code_points` test
# in lib.rs is what enforces it.
automerge.workspace = true

rinch-code-editor-buffer.workspace = true

[dev-dependencies]
# Not a dependency of this crate and never will be: nothing here knows what an
# editor is. It appears only in `model_sync.rs`, which drives two real
# `EditorModel`s through two documents to pin the integration contract end to
# end — the one place both halves have to be in the room together.
rinch-code-editor-model.workspace = true
