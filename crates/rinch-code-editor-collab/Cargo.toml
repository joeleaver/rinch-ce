[package]
name = "rinch-code-editor-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-agnostic collaborative editing for the rinch code editor (automerge)"

[dependencies]
# Pinned to the 0.10 line (the "automerge 3" hexane core). NO features on any
# target: with neither `utf8-indexing` nor `utf16-indexing` enabled, automerge
# indexes Text in Unicode scalar values — exactly ropey's char indexing, so
# splices and patches cross the boundary with no offset conversion. A test in
# lib.rs pins this: a transitive dependency silently enabling either feature
# would corrupt every exchanged offset. (On wasm builds the consumer enables
# automerge's `wasm` feature; it does not affect indexing.)
automerge = "0.10"

rinch-code-editor-buffer.workspace = true
