[package]
name = "rinch-code-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A Monaco-parity code editor component for the rinch GUI framework"

[dependencies]
# rinch is a PEER dependency: default-features off, no backend. The editor links
# no renderer or windowing of its own — the consuming application chooses
# `desktop`/`gpu` or brings `rinch-web`, and owns the `[patch.crates-io]` block
# rinch's desktop build needs. See README.md ("rinch is a peer dependency").
# The facade re-exports `rinch::core` (= rinch-core) and the `rsx!`/`component`
# macros unconditionally, so `rsx!` resolves with no shim and no backend feature.
# `clipboard` is the one facade feature the editor turns on itself: Ctrl+X/C/V
# are core editing, and rinch-clipboard is backend-neutral (arboard on desktop,
# an in-page buffer on wasm) so it drags no renderer in.
rinch = { workspace = true, features = ["clipboard"] }

rinch-code-editor-model.workspace = true

# Portable clock for the multi-click counter — std::time::Instant panics on
# wasm32-unknown-unknown; this is the same crate rinch itself uses.
web-time = "1"

# Language support is forwarded, feature-for-feature, to the model crate (which
# forwards to the syntax crate). Turning on `lang-rust` here compiles the Rust
# grammar in and makes `language: "rust"` highlight; a build with none of these
# links no tree-sitter and no C, and `CodeEditor` falls back to plain text. This
# is the lean Joe approved: no runtime grammar loading, no dynamic registry —
# the set of languages is a compile-time decision the consuming app owns.
[dev-dependencies]
# For `MockDomDocument`: the focus tests mount editors with no backend, and a
# `NodeHandle` needs a document type even when it points at none.
rinch-core = { workspace = true, features = ["test-util"] }

[features]
default = []
tree-sitter = ["rinch-code-editor-model/tree-sitter"]

lang-rust = ["tree-sitter", "rinch-code-editor-model/lang-rust"]
lang-typescript = ["tree-sitter", "rinch-code-editor-model/lang-typescript"]
lang-javascript = ["tree-sitter", "rinch-code-editor-model/lang-javascript"]
lang-html = ["tree-sitter", "rinch-code-editor-model/lang-html"]
lang-css = ["tree-sitter", "rinch-code-editor-model/lang-css"]
lang-json = ["tree-sitter", "rinch-code-editor-model/lang-json"]
lang-toml = ["tree-sitter", "rinch-code-editor-model/lang-toml"]
lang-yaml = ["tree-sitter", "rinch-code-editor-model/lang-yaml"]
lang-markdown = ["tree-sitter", "rinch-code-editor-model/lang-markdown"]

all-languages = ["tree-sitter", "rinch-code-editor-model/all-languages"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(web_sys_unstable_apis)'] }
