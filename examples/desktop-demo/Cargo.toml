[package]
name = "rinch-code-editor-desktop-demo"
version.workspace = true
edition.workspace = true
publish = false

# The example is the *consumer* in the peer-dependency story: it is what turns
# on a backend. It enables rinch's `desktop` feature (the library never does) and
# `debug` (so the rinch MCP debug server can attach for screenshots/input).
[dependencies]
rinch = { workspace = true, features = ["desktop", "debug"] }
# The sample document is Rust, so the consumer compiles the Rust grammar in. This
# is the only place a language is chosen — the library ships none by default.
rinch-code-editor = { workspace = true, features = ["lang-rust"] }
